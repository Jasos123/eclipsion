name: PR Agent Summary

# Required repository Actions secret: OPENAI_KEY
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

concurrency:
  group: pr-agent-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summarize:
    if: github.event.sender.type != 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # PR-Agent reads the diff through the GitHub API. Do not check out the
      # untrusted PR head in a pull_request_target workflow.
      - name: Summarize pull request
        uses: docker://pragent/pr-agent:0.42.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/describe"]'
          pr_description.publish_description_as_comment: "true"
          pr_description.publish_description_as_comment_persistent: "true"
          pr_description.final_update_message: "false"
          pr_description.enable_pr_diagram: "false"
