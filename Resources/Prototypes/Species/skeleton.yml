- type: species
  id: Skeleton
  name: species-name-skeleton
  roundStart: true
  prototype: MobSkeletonPerson
  sprites: MobSkeletonSprites
  defaultSkinTone: "#fff9e2"
  markingLimits: MobSkeletonMarkingLimits
  maleFirstNames: skeletonNamesFirst
  femaleFirstNames: skeletonNamesFirst
  dollPrototype: MobSkeletonPersonDummy
  skinColoration: TintedHues
  # Skeletons are a TFSC-only species. Additional role gating is handled separately
  # on the TFSC jobs themselves, since those exceptions are per-job rather than per-faction.
  factions:
  - TFSC
  # Height/width are locked like the other round-start species on this fork.
  minHeight: 1
  defaultHeight: 1
  maxHeight: 1
  minWidth: 1
  defaultWidth: 1
  maxWidth: 1

# Skeletons have no flesh, so the fur/snout/underwear layers that the human
# limits hand out do not apply. Hair still renders on the mob's Hair layer.
- type: markingPoints
  id: MobSkeletonMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false

- type: speciesBaseSprites
  id: MobSkeletonSprites
  sprites:
    Head: MobSkeletonHead
    Chest: MobSkeletonTorso
    LArm: MobSkeletonLArm
    RArm: MobSkeletonRArm
    LHand: MobSkeletonLHand
    RHand: MobSkeletonRHand
    LLeg: MobSkeletonLLeg
    RLeg: MobSkeletonRLeg
    LFoot: MobSkeletonLFoot
    RFoot: MobSkeletonRFoot

