- type: psionicSkillTree
  id: PsionicMindTree
  name: psionic-skill-tree-mind-name
  branches: [ PsionicMindBranch ]
  skills: [ PsiSkillTelepathy, PsiSkillNoosphericZap, PsiSkillTelekineticManipulation ]

- type: entity
  id: ActionPsionicSkillTree
  name: action-name-psionic-skill-tree
  description: action-description-psionic-skill-tree
  categories: [ HideSpawnMenu ]
  components:
    - type: InstantAction
      icon: Interface/VerbIcons/metapsionic.png
      itemIconStyle: BigAction
      event: !type:OpenPsionicSkillTreeActionEvent
