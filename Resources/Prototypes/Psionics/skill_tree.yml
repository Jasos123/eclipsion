  icon: { sprite: Interface/Actions/psionic_recurrence.rsi, state: reweave }
  branch: PsionicRecurrenceBranch
  power: PsionicArmorReweavePower
  tier: 1
  minimumLevel: 3
  prerequisites: [ PsiSkillStasisField ]

- type: psionicSkill
  id: PsiSkillRecurrencePulse
  name: psionic-skill-recurrence-pulse-name
  description: psionic-skill-recurrence-pulse-description
  icon: { sprite: Interface/Actions/psionic_recurrence.rsi, state: recurrence_pulse }
  branch: PsionicRecurrenceBranch
  power: PsionicRecurrencePulsePower
  tier: 2
  minimumLevel: 4
  prerequisites: [ PsiSkillArmorReweave ]

- type: psionicSkillTree
  id: PsionicGeneralTree
  name: psionic-skill-tree-general-name
  branches:
