  tier: 2
  cost: 2
  minimumLevel: 4
  prerequisites: [ PsiSkillArmorUpgrade ]

# Recurrence class. An advanced discipline: it does not open until psionic level 2, which is what
# keeps it out of a fresh Psion's hands. Past that gate the nodes cost one point each, so the whole
# branch fits inside the four points a Psion holds at level four even after taking a primary
# discipline - roughly the back half of a normal round rather than all of a long one.
- type: psionicSkill
  id: PsiSkillStasisField
  name: psionic-skill-stasis-field-name
  description: psionic-skill-stasis-field-description
  icon: { sprite: Interface/Actions/psionic_recurrence.rsi, state: stasis_field }
  branch: PsionicRecurrenceBranch
  power: PsionicStasisFieldPower
  tier: 0
  minimumLevel: 2

- type: psionicSkill
  id: PsiSkillArmorReweave
  name: psionic-skill-armor-reweave-name
