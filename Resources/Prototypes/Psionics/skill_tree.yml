# Fire class: three linked powers.
- type: psionicSkill
  id: PsiSkillFireball
  name: psionic-skill-fireball-name
  description: psionic-skill-fireball-description
  icon: { sprite: Interface/Actions/psionics.rsi, state: pyrokinetic_flare }
  branch: PsionicFireBranch
  power: PyrokineticFlare
  tier: 0
  minimumLevel: 1
  exclusiveGroup: PsionicPrimaryDiscipline

- type: psionicSkill
  id: PsiSkillPyrokinesis
  name: psionic-skill-pyrokinesis-name
  description: psionic-skill-pyrokinesis-description
  icon: Interface/VerbIcons/pyrokinesis.png
  branch: PsionicFireBranch
  power: PyrokinesisPower
  tier: 1
  minimumLevel: 2
  prerequisites: [ PsiSkillFireball ]

- type: psionicSkill
