    - PsionicStealthBranch
    - PsionicLifeBranch
    - PsionicMindBranch
    - PsionicKineticBranch
    - PsionicDefenseBranch
    - PsionicRecurrenceBranch
  skills:
    - PsiSkillFireball
    - PsiSkillSummonImp
    - PsiSkillFlameBreath
    - PsiSkillVeilSight
    - PsiSkillShadeskip
    - PsiSkillDarkSwap
    - PsiSkillHealingWord
    - PsiSkillRegeneration
    - PsiSkillRevivify
    - PsiSkillTelepathy
    - PsiSkillNoosphericZap
    - PsiSkillTelekineticManipulation
    - PsiSkillAnoigo
    - PsiSkillKineticSlam
    - PsiSkillTelekineticPulse
    - PsiSkillSelfShield
    - PsiSkillArmorUpgrade
    - PsiSkillAegisDome
    - PsiSkillStasisField
    - PsiSkillArmorReweave
    - PsiSkillRecurrencePulse

- type: psionicSkillTree
  id: PsionicFireTree
  name: psionic-skill-tree-fire-name
  branches: [ PsionicFireBranch ]
  skills: [ PsiSkillFireball, PsiSkillSummonImp, PsiSkillFlameBreath ]

- type: psionicSkillTree
  id: PsionicLifeTree
  name: psionic-skill-tree-life-name
  branches: [ PsionicLifeBranch ]
