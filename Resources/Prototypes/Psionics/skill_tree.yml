    - PsionicFireBranch
    - PsionicStealthBranch
    - PsionicLifeBranch
    - PsionicMindBranch
    - PsionicKineticBranch
  skills:
    - PsiSkillFireball
    - PsiSkillPyrokinesis
    - PsiSkillSummonImp
    - PsiSkillVeilSight
    - PsiSkillInvisibility
    - PsiSkillShadeskip
    - PsiSkillDarkSwap
    - PsiSkillHealingWord
    - PsiSkillRegeneration
    - PsiSkillRevivify
    - PsiSkillTelepathy
    - PsiSkillMetapsionics
    - PsiSkillNoosphericZap
    - PsiSkillMassSleep
    - PsiSkillMindSwap
    - PsiSkillAnoigo
    - PsiSkillTelekineticPulse
    - PsiSkillDispel

- type: psionicSkillTree
  id: PsionicFireTree
  name: psionic-skill-tree-fire-name
  branches: [ PsionicFireBranch ]
  skills: [ PsiSkillFireball, PsiSkillPyrokinesis, PsiSkillSummonImp ]

- type: psionicSkillTree
  id: PsionicLifeTree
  name: psionic-skill-tree-life-name
