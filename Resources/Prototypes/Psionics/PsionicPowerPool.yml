- type: weightedRandom
  id: RandomPsionicPowerPool
  weights:
    AnoigoPower: 0.25
    DispelPower: 0.5
    TelegnosisPower: 0.5
    PsionicRegenerationPower: 0.75
    TelepathyPower: 1 # Leads to Xenoglossy and Psychognomy
    HealingWordPower: 0.4 # Leads to revivify
    ShadeskipPower: 0.4 # Leads to darkswap
    TelekineticPulsePower: 0.35
    PyrokineticFlare: 0.6 # Leads to summon imp and pyrokenisis
    NoosphericZapPower: 0.35
    TelekineticManipulationPower: 0.35
    PsionicSelfShieldPower: 0.4

- type: weightedRandom
  id: PsychoHistorianPowerPool # Significantly trimmed down pool, MUCH faster power generation. Free Telepathy.
  weights:
    DispelPower: 1
    TelegnosisPower: 1
    PsionicRegenerationPower: 1
    NoosphericZapPower: 0.5
    TelekineticManipulationPower: 0.35

- type: weightedRandom
  id: ElementalistPowerPool # Significantly slower power generation. No Telepathy.
  weights:
    AnoigoPower: 0.25
    HealingWordPower: 0.5
    ShadeskipPower: 0.5
    TelekineticPulsePower: 0.75
    PyrokineticFlare: 0.5
    NoosphericZapPower: 0.25

- type: weightedRandom
  id: BiomancerPowerPool # Handles bio-energy, focusing on medical applications.
  weights:
    PsionicRegenerationPower: 0.5
    HealingWordPower: 2 #this leads to revivify

- type: weightedRandom
  id: PyromancerPowerPool # Only pyrokinetic flare, which leads to other upgrades.
  weights:
    PyrokineticFlare: 1 # Leads to summon imp and pyrokenisis
