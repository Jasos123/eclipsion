- type: vessel
  id: Imparator
  name: DSM Imparator
  description: |
    An imperial support ship, made to shoot from the backlines and provide firepower from a distance. It suffers in close-quarters combat, relying on its plasma gatling for point defense.
    LOADOUT: 1x 150cc 'Retribution' Pulse Laser, 1x 200cc 'Starburst' Plasma Gatling
    SHIELD: Absent
    SPEED: 20 m/s
  price: 37000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/DSM/imparator.yml

- type: gameMap
  id: Imparator
  mapName: 'DSM Imparator'
  mapPath: /Maps/_Crescent/Shuttles/DSM/imparator.yml
  minPlayers: 0
  stations:
    Imparator:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: fighter
        - type: StationNameSetup
          mapNameTemplate: 'DSM Imparator {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-fighter
        - type: VesselDescription
          description: Wise ritters know that this small but powerful ship can cause some righteous trouble.
