- type: vessel
  id: Magnate
  name: DSM Magnate FSV
  description: |
    An imperial fire support vessel, designed for fleet support with its gargoyle launcher for bypassing enemy shields.
    LOADOUT: 1x 240mm 'Gargoyle' Torpedo Launcher, 4x 150cc 'Retribution' Pulse Laser
    SHIELD: Errant
    SPEED: 30 m/s
  price: 40000
  category: Medium
  group: None
  path: /Maps/_Crescent/Shuttles/DSM/magnate.yml

- type: gameMap
  id: Magnate
  mapName: 'DSM Magnate'
  mapPath: /Maps/_Crescent/Shuttles/DSM/magnate.yml
  minPlayers: 0
  stations:
    Magnate:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'DSM Magnate {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-frigate
        - type: VesselDescription
          description: DSM Fire support vessel.
