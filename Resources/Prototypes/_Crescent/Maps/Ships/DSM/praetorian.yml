- type: vessel
  id: Praetorian
  name: DSM Praetorian
  description: |
    An Imperial patrol corvette.
    LOADOUT: 2x 48mm 'Shortbow' SRM, 1x 350cc 'Glare' burst laser, 4x 150cc 'Retribution' pulse laser
  price: 65000
  category: Medium
  group: None
  path: /Maps/_Crescent/Shuttles/DSM/praetorian.yml

- type: gameMap
  id: Praetorian
  mapName: 'DSM Praetorian'
  mapPath: /Maps/_Crescent/Shuttles/DSM/praetorian.yml
  minPlayers: 0
  stations:
    Praetorian:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'DSM Praetorian {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-destroyer
        - type: VesselDescription
          description: Fielded by imperials to establish dominance in the battlefield.
