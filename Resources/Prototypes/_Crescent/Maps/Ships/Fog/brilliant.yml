- type: vessel
  id: Brilliant
  name: NT Brilliant
  description: |
    A massive autonomous warship deployed by NanoTrasen around the recurrence-active Fracture. It has drifted through repeated Turnings and still fires. Nobody is sure how much of its current state is original.
    LOADOUT: 1x 800c "Rimward" hybrid plasma blaster, 2x 70mm "Jeong" swarmrocket platform, 1x 88mm 'Prince' flak-screen turret, 5x ballistic turret, 6x SHI 180c 'Torch' pressure gatling
    SHIELD: Goliath
    SPEED: 20 m/s
  price: 450000
  category: Large
  group: None
  path: /Maps/_Crescent/Shuttles/Fog/brilliant.yml

- type: gameMap
  id: Brilliant
  mapName: 'NT Brilliant'
  mapPath: /Maps/_Crescent/Shuttles/Fog/brilliant.yml
  minPlayers: 0
  stations:
     Brilliant:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: cruiser
        - type: StationNameSetup
          mapNameTemplate: 'NT Brilliant {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-destroyer
        - type: VesselDescription
          description: A heavy autonomous platform created to survive unstable recurrence fields.
