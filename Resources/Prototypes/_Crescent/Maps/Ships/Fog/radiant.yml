- type: vessel
  id: Radiant
  name: NT Radiant
  description: |
    The largest autonomous hull NanoTrasen fielded for recurrence-zone recovery and perimeter defense. It is yours now, if you can afford it.
    LOADOUT: 3x 350c "Compakt" hybrid energy gatling, 2x 800c "Rimward" hybrid plasma blaster, 2x NT 88mm 'Regent' flak-screen turret, 10x ballistic turret
    SHIELD: Bulwark
    SPEED: 20 m/s
  price: 1000000 
  category: Large
  group: None
  path: /Maps/_Crescent/Shuttles/Fog/radiant.yml

- type: gameMap
  id: Radiant
  mapName: 'NT Radiant'
  mapPath: /Maps/_Crescent/Shuttles/Fog/radiant.yml
  minPlayers: 0
  stations:
     Radiant:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: capital
        - type: StationNameSetup
          mapNameTemplate: 'NT Radiant {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-flagship
        - type: VesselDescription
          description: A heavy autonomous platform created to survive unstable recurrence fields.
