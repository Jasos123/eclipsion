- type: vessel
  id: Beta
  name: NT Beta
  description: One of NanoTrasen's autonomous frontline drones, salvaged from a recurrence-active wreck field. Lighter than the Alpha and cheaper to run, with just as much willingness to shoot at things.
  price: 36000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/Fog/beta.yml

- type: gameMap
  id: Beta
  mapName: 'NT Beta'
  mapPath: /Maps/_Crescent/Shuttles/Fog/beta.yml
  minPlayers: 0
  stations:
     Beta:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: fighter
        - type: StationNameSetup
          mapNameTemplate: 'NT Beta {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-fighter
        - type: VesselDescription
          description: Created to operate in unstable recurrence fields around the Fracture.
