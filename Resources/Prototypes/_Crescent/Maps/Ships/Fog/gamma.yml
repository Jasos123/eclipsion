- type: vessel
  id: Gamma
  name: NT Gamma
  description: |
    A heavier NanoTrasen autonomous fighter recovered from a recurrence-active wreck field. The extra cost buys you more gun and a slightly longer life expectancy.
    LOADOUT: 1x TFCF 'Swarmer' self-replicating missile pod, 1x ballistic turret
    SHIELD: Absent
    SPEED: 30 m/s
  price: 48000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/Fog/gamma.yml

- type: gameMap
  id: Gamma
  mapName: 'NT Gamma'
  mapPath: /Maps/_Crescent/Shuttles/Fog/gamma.yml
  minPlayers: 0
  stations:
     Gamma:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'NT Gamma {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-fighter
        - type: VesselDescription
          description: Created to operate in unstable recurrence fields around the Fracture.
