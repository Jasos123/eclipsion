- type: vessel
  id: Hive
  name: Hive
  description: |
    The Hive is made from the remains of a derelict superfreighter, what was once its cargo bays now serving as hangars for its complement of fighters.
    LOADOUT: 2x 48mm 'Shortbow' SRM, 2x 90mm 'Resolute' Assault Battery, 1x 120mm 'Anvil' Artillery, 2x 20mm 'Screamer' Rotary Cannon
    SHIELD: Absent
    SPEED: 20 m/s
  price: 90000
  category: Large
  group: Scrap
  path: /Maps/_Crescent/Shuttles/Civilian/hive.yml

- type: gameMap
  id: Hive
  mapName: 'Hive'
  mapPath: /Maps/_Crescent/Shuttles/Civilian/hive.yml
  minPlayers: 0
  stations:
    Hive:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: carrier
        - type: StationNameSetup
          mapNameTemplate: 'Hive {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-artillery-carrier
        - type: VesselDescription
          description: The Hive, the vagrant's carrier. Try your best not to get flanked.
