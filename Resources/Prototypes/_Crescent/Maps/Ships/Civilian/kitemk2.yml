- type: vessel
  id: Kitemk2
  name: Kite MKII
  description: |
    A combat capable retrofit of the kite. Its hull has been carved out to make way for its modifications, with the wings being exposed to vacuum as a consequence.
    LOADOUT: 2x 48mm 'Shortbow' SRM
    SHIELD: Absent
    SPEED: 30 m/s
  price: 37000
  category: Small
  group: Scrap
  path: /Maps/_Crescent/Shuttles/Civilian/kitemk2.yml

- type: gameMap
  id: Kitemk2
  mapName: 'Kite MKII'
  mapPath: /Maps/_Crescent/Shuttles/Civilian/kitemk2.yml
  minPlayers: 0
  stations:
    Kitemk2:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'Kite MKII {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-gunship
        - type: VesselDescription
          description: The Kite MKII has a reputation for suffering reliability issues. Watch out for its vac-exposed wings.
