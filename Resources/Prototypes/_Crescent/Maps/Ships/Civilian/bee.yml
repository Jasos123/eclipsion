- type: vessel
  id: Bee
  name: Bee
  description: |
    A variant of the Wasp, the Bee carries a 30mm 'Pila' micromissile launcher, unleashing a rapid swarm of missiles at the cost of frequent reloading for continuous use. It is wise to consider hit-and-run tactics with this fighter.
    LOADOUT: 1x 30mm 'Pila' Micromissile Launcher
    SHIELD: Absent
    SPEED: 40 m/s
  price: 12000
  category: Small
  group: Scrap
  path: /Maps/_Crescent/Shuttles/Civilian/bee.yml

- type: gameMap
  id: Bee
  mapName: 'Bee'
  mapPath: /Maps/_Crescent/Shuttles/Civilian/bee.yml
  minPlayers: 0
  stations:
    Bee:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: fighter
        - type: StationNameSetup
          mapNameTemplate: 'Bee {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-fighter
        - type: VesselDescription
          description: The Bee gets its name from its loadout- sting once and die.
