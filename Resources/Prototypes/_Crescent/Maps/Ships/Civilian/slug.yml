- type: vessel
  id: Slug
  name: Slug
  description: |
    Recycled from the remains of a destroyed cargo ship, the Slug now lives its second life as a salvage ship. Its cargo hold now acting as a salvage bay. Remember to lock your console before leaving the ship unattended.
    LOADOUT: Armless
    SHIELD: Absent
    SPEED: 30 m/s
  price: 16000
  category: Small
  group: Scrap
  path: /Maps/_Crescent/Shuttles/Civilian/slug.yml

- type: gameMap
  id: Slug
  mapName: 'Slug'
  mapPath: /Maps/_Crescent/Shuttles/Civilian/slug.yml
  minPlayers: 0
  stations:
    Slug:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: civilian
        - type: StationNameSetup
          mapNameTemplate: 'Slug {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-salvage
        - type: VesselDescription
          description: Flying revived derelicts is not uncommon among less fortunate independents.
