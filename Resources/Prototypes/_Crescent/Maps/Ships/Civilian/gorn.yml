- type: vessel
  id: Gorn
  name: ICM Gorn
  description: |
    A compact mining vessel with powerful drills, onboard ore processing, and good maneuverability.
    EQUIPMENT: 2x Exhumer
    LOADOUT: Unarmed
    SHIELD: None
    SPEED: 20 m/s
  price: 31000
  category: Small
  group: Civilian
  path: /Maps/_Crescent/Shuttles/Civilian/gorn.yml

- type: gameMap
  id: Gorn
  mapName: 'ICM Gorn'
  mapPath: /Maps/_Crescent/Shuttles/Civilian/gorn.yml
  minPlayers: 0
  stations:
    Gorn:
      stationProto: StandardCrescentExpeditionVessel
      gridComponents:
        - type: MapIcon
          iconType: Shuttle
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: civilian
        - type: StationNameSetup
          mapNameTemplate: 'ICM Gorn {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-mining
        - type: VesselDescription
          description: A compact mining vessel with onboard ore processing.
