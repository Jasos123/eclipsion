- type: vessel
  id: OldCorsair
  name: PTA Corsair
  description: |
    A well-armed Pang Tai frigate designed for supporting its larger cousin, the Hammerhead, as part of a wider series of mercenary ships. Used as both a line vessel as well as a platform for special operations and CSAR missions. 
    LOADOUT: 3x medium 'Lancer' MRM missile system, 2x 60mm PTA 'Needler' heavy precision autogun, 2x SHI MG-213 light dual machinegun 20x135mm, 3x 20mm PTA "Operator" gatling turret
    SHIELD: Errant
    SPEED: 30 m/s
  price: 110000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/Civilian/oldcorsair.yml

- type: gameMap
  id: OldCorsair
  mapName: 'PTA Corsair'
  mapPath: /Maps/_Crescent/Shuttles/Civilian/oldcorsair.yml
  minPlayers: 0
  stations:
    OldCorsair:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'PTA Corsair {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-frigate
        - type: VesselDescription
          description: Well-fitted for short, high-intensity deployments, the Corsair struggles during prolonged combat.
