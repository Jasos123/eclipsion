- type: vessel
  id: Sentry
  name: TS Sentry
  description: |
    A swift and small fighter featuring plasma gatlings. Can handle shields and armor but at close range.
    Original prototype design featured dual hardlight repeaters. After TSP was disbanded and the militia lost DSM backing, access to such technology was lost.
    LOADOUT: 2x 200cc 'Starburst' Plasma Gatling
    SHIELD: Absent
    SPEED: 35 m/s
  price: 20000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/CMM/sentry.yml

- type: gameMap
  id: Sentry
  mapName: 'TS Sentry'
  mapPath: /Maps/_Crescent/Shuttles/CMM/sentry.yml
  minPlayers: 0
  stations:
    Sentry:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: fighter
        - type: StationNameSetup
          mapNameTemplate: 'TS Sentry {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-fighter
        - type: VesselDescription
          description: A small compact fighter, excels at short-range brawling.

