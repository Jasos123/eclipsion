- type: vessel
  id: Respondant
  name: TS Respondant
  description: |
    A compact corvette built to brawl. Once a militia mainstay, the Respondant trades armor for a punchy mix of autocannons and rocket pods, letting a skilled pilot chip away at targets before closing in for the kill.
    LOADOUT: 2x 60mm 'Azimuth' Rocket Pod, 2x 50mm 'Striker' Heavy Autocannon
    SHIELD: Absent
    SPEED: 35 m/s
  price: 35000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/CMM/respondant.yml

- type: gameMap
  id: Respondant
  mapName: 'TS Respondant'
  mapPath: /Maps/_Crescent/Shuttles/CMM/respondant.yml
  minPlayers: 0
  stations:
    Respondant:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'TS Respondant {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-corvette
        - type: VesselDescription
          description: A compact corvette, good at brawling. A skilled pilot can pick targets off at range with its Strikers.
