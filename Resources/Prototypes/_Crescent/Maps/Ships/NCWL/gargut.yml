- type: vessel
  id: Gargut
  name: NCWL Gargut
  description: |
    A lumbering battlecarrier platform, converted from a derelict fabstation.
    LOADOUT: 2x 60mm 'Azimuth' Rocket Pod, 1x 88mm 'Stormreign' Flak Array, 1x 350cc 'Glare' Burst Laser, 1x 35mm 'Scout' Autocannon, 7x 150cc 'Retribution' Pulse Laser
    SHIELD: Bulwark
    SPEED: 20 m/s
  price: 125000
  category: Large
  group: None
  path: /Maps/_Crescent/Shuttles/NCWL/gargut.yml

- type: gameMap
  id: Gargut
  mapName: 'NCWL Gargut'
  mapPath: /Maps/_Crescent/Shuttles/NCWL/gargut.yml
  minPlayers: 0
  stations:
    Gargut:
      stationProto: StandardCrescentStation
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: battleship
        - type: StationNameSetup
          mapNameTemplate: 'NCWL Gargut {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-cruiser
        - type: StationJobs
          overflowJobs: []
          availableJobs: {} # Eclipsion - drone cruiser, no crew roles spawn here
