- type: vessel
  id: Ivarod
  name: NCWL Ivarod
  description: |
    A converted light destroyer, purpose-built with endurance in mind.
    LOADOUT: 2x Homeguard 95mm 'Warden' Medium Missile System, 4x 150cc 'Retribution' Pulse Laser, 2x 50mm 'Striker' Heavy Autocannon, 2x 200cc 'Starburst' Plasma Gatling
    SHIELD: Absent
    SPEED: 30 m/s
  price: 200000
  category: Large
  group: None
  path: /Maps/_Crescent/Shuttles/NCWL/ivarod.yml

- type: gameMap
  id: Ivarod
  mapName: 'NCWL Ivarod'
  mapPath: /Maps/_Crescent/Shuttles/NCWL/ivarod.yml
  minPlayers: 0
  stations:
    Ivarod:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: cruiser
        - type: StationNameSetup
          mapNameTemplate: 'NCWL Ivarod {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-destroyer
