- type: vessel
  id: Hulk
  name: IPM Hulk
  description: |
    A mobile hospital on thrusters. Quite heavy, yet underarmed.
    LOADOUT: 2x 95mm 'Arbalest' Medium Missile System, 6x 200cc 'Starburst' Plasma Gatling
    SHIELD: Absent
    SPEED: 25 m/s
  price: 140000
  category: Large
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/hulk.yml

- type: gameMap
  id: Hulk
  mapName: 'IPM Hulk'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/hulk.yml
  minPlayers: 0
  stations:
    Hulk:
      stationProto: StandardCrescentCivilianVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: capital
        - type: StationNameSetup
          mapNameTemplate: 'IPM Hulk {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-medical
