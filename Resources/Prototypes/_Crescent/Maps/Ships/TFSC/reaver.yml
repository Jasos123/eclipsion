- type: vessel
  id: Reaver
  name: GSC Reaver
  description: |
    A medium Syndicate fighter.
    LOADOUT: 1x 50mm 'Striker' Heavy Autocannon, 1x 20mm 'Screamer' Rotary Cannon
    SHIELD: Absent
    SPEED: 35 m/s
  price: 25000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/reaver.yml

- type: gameMap
  id: Reaver
  mapName: 'GSC Reaver'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/reaver.yml
  minPlayers: 0
  stations:
    Reaver:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: fighter
        - type: StationNameSetup
          mapNameTemplate: 'GSC Reaver {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-fighter
