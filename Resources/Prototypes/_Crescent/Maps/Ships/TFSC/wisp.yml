    A repurposed civilian hull, converted into a nimble smuggling shuttle.
    LOADOUT: Armless
    SHIELD: Absent
    SPEED: 20 m/s
  price: 35000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/wisp.yml

- type: gameMap
