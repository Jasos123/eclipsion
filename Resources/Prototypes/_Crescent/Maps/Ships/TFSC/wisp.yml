  mapName: 'CD Wisp'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/wisp.yml
  minPlayers: 0
  stations:
    Wisp:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'CD Wisp {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-smuggling
