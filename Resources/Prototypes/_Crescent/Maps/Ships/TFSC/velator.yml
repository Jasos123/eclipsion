- type: vessel
  id: Velator
  name: CD Velator
  description: |
    A light Syndicate electronic warfare corvette with an onboard saboteur's armory.
    LOADOUT: 1x 240mm 'Gargoyle' Torpedo Launcher, 1x 200cc 'Starburst' Plasma Gatling
  price: 60000
  category: Medium
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/velator.yml

- type: gameMap
  id: Velator
  mapName: 'CD Velator'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/velator.yml
  minPlayers: 0
  stations:
    Velator:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'CD Velator {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-electronic
