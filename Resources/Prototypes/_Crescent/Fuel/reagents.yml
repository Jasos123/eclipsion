- type: reagent
  id: AmeCatalyst
  name: reagent-name-ame-catalyst
  desc: reagent-desc-ame-catalyst
  physicalDesc: reagent-physical-desc-shiny
  color: "#8ad6e8"
  recognizable: true
  boilingPoint: 210.0
  meltingPoint: 45.0
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 8
            Radiation: 4

- type: reagent
  id: AmeFuel
  name: reagent-name-ame-fuel
  parent: BasePyrotechnic
  desc: reagent-desc-ame-fuel
  physicalDesc: reagent-physical-desc-shiny
  flavor: bitter
  flavorMinimum: 0.01
  color: "#6f2fd6"
  recognizable: true
  boilingPoint: -196.0
  meltingPoint: -210.0
  tileReactions:
  - !type:FlammableTileReaction
    temperatureMultiplier: 4
  # BasePyrotechnic is overridden here, so keep FlammableReaction explicit.
  # Soaking someone in fuel must NOT light them: it only coats them in fire stacks,
  # so they burn hard once something actually touches them off.
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:FlammableReaction
        multiplier: 1
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 8
            Poison: 10
            Radiation: 12
            Caustic: 4
      - !type:FlammableReaction
        multiplier: 0.8
