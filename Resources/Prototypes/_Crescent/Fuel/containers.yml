# AmeJar is the refillable antimatter container.

- type: entity
  parent: FuelCan
  id: FuelCanisterBoriaticT1
  name: boriatic fuel canister
  description: A pressure canister of boriatic fuel. Standard issue, holds 200 units.
  categories: [ ]
  components:
  - type: Label
    currentLabel: reagent-name-Boriatic-fuel
  - type: Sprite
    sprite: _Crescent/Objects/Misc/fuelcan.rsi
    color: "#e0a33c"
    layers:
      - state: jug
      - state: jug1
        map: [ "enum.SolutionContainerLayers.Fill" ]
        visible: false
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 200
  - type: SolutionTransferDirection
  - type: StaticPrice
    price: 60

- type: entity
  parent: FuelCanisterBoriaticT1
  id: FuelCanisterBoriaticT2
  name: reinforced boriatic fuel canister
  description: A reinforced pressure canister of boriatic fuel. Holds 500 units.
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 500
  - type: StaticPrice
    price: 140

- type: entity
  parent: FuelCanisterBoriaticT1
  id: FuelCanisterBoriaticT3
  name: bulk boriatic fuel canister
  description: A compound-wound bulk canister of boriatic fuel. Holds 1000 units.
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 1000
  - type: StaticPrice
    price: 280

- type: entity
  parent: FuelCanisterBoriaticT1
  id: FuelCanisterBoriaticT1Full
  suffix: Full
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 200
        reagents:
        - ReagentId: BoriaticFuel
          Quantity: 200

- type: entity
  parent: FuelCanisterBoriaticT2
  id: FuelCanisterBoriaticT2Full
