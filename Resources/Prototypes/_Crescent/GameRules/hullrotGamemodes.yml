### HYPERWAR ###
# NCWL vs DSM clashing over the central asteroid belt.
# Uses the special RatWorldHyperwar worldgen (central belt kept, surrounding ring removed).

- type: gamePreset
  id: Hyperwar
  alias:
  - hyperwar
  name: Hyperwar | NCWL vs DSM
  showInVote: true
  description: NCWL and DSM wage a brutal hyperwar over the heart of Taypan. Last 2-4 hours.
  excludedJobs:
  - UnionfallCadetDSM
  - UnionfallRiflemanDSM
  - UnionfallDoctorDSM
  - UnionfallOfficerDSM
  - UnionfallLeaderDSM
  - UnionfallShipCaptainDSM
  - UnionfallShipCrewDSM
  - UnionfallCadetNCWL
  - UnionfallRiflemanNCWL
  - UnionfallDoctorNCWL
  - UnionfallOfficerNCWL
  - UnionfallLeaderNCWL
  - UnionfallShipCaptainNCWL
  - UnionfallShipCrewNCWL
  - planetfall_worker
  - planetfall_partisan
  - planetfall_mvdofficer
  - planetfall_mvdgrunt
  - planetfall_kapitan
  - planetfall_doctor
  - planetfall_courtier
  - planetfall_advocatus
  - planetfall_governor
  - planetfall_freeholder
  - planetfall_oathbound
  - planetfall_levyman
  - planetfall_surgeon
