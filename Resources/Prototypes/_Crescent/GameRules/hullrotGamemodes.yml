# GAME PRESETS ARE WHAT YOU VOTE ON AS A GAMEMODE.
# They do NOT CONTROL what spawns in by themselves. this is handled by the rule that it's pointing to in the rules: dictionary
#
# GAMERULES ARE WHAT DECIDES WHAT SPAWNS IN, BY EVERYTHING IN THE ADVENTURERULE COMPONENT
#
# gameMapsByID is a DICTIONARY that describes all spawned grids defined by a gameMap.
# this is stuff like Port Balreska, which has nova_balreska.yml (MAP) and novabalreska.yml (PROTOTYPE)
# you can give the dictionary key whatever name you want
# gameMapID must equal the ID of the gameMap prototype's YML.
# posX & posY define the position it will be spawned at
# randomOffsetX & randomOffsetY describe an offset that will be applied to the position. leave undefined or at 0 to spawn as is. This offset is ALWAYS POSITIVE.
# IFFColor changes what color the IFF in the shuttle and map screen will have. Use colors from the Color type, like White, Aqua, Blue, etc.
# IFFFaction sets the faction of the object. to be honest i dont know if this does anything.
# hideIFF is a boolean that controls if the object is visible from the map screen or not. by default it is set to false. use this for derelicts or secrets
# worldgenConfig picks the asteroid/biome layout (see _Crescent/World/worldgen.yml). Defaults to RatWorld when unset.


### FREEPLAY ###
# The Adventure preset below is NOT the default: game.defaultpreset in CCVars.Game.cs resolves
# "freeplaydsmncwl" to the FreeplayDSMNCWL preset further down.

- type: gamePreset
  id: Adventure #FREEPLAY, DO NOT REMOVE
  alias:
  - adventure
  name: Freeplay
  showInVote: true
  description: An open shift on Taypan's volatile commercial frontier. Lasts 2-4 hours.
  excludedJobs:
  - UnionfallCadetDSM
  - UnionfallRiflemanDSM
  - UnionfallDoctorDSM
  - UnionfallOfficerDSM
  - UnionfallLeaderDSM
  - UnionfallShipCaptainDSM
  - UnionfallShipCrewDSM
  - UnionfallCadetNCWL
  - UnionfallRiflemanNCWL
  - UnionfallDoctorNCWL
  - UnionfallOfficerNCWL
  - UnionfallLeaderNCWL
  - UnionfallShipCaptainNCWL
  - UnionfallShipCrewNCWL
  - planetfall_worker
  - planetfall_partisan
  - planetfall_mvdofficer
  - planetfall_mvdgrunt
  - planetfall_kapitan
  - planetfall_doctor
  - planetfall_courtier
  - planetfall_advocatus
  - planetfall_governor
  - planetfall_freeholder
  - planetfall_oathbound
  - planetfall_levyman
  - planetfall_surgeon
  rules:
  - Adventure
  - HullrotEventScheduler
  - HullrotRoundTimeLimit
  - HullrotConquest

- type: entity
  id: Adventure #FREEPLAY, DO NOT REMOVE
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GamemodeRespawnTime
    respawnTimeMinutes: 10
  - type: AdventureRule
    gameMapsByID:
      PortBalreska:
        gameMapID: PortBalreska
        posX: -2000
        posY: -5000
        IFFColor: Orange
        IFFFaction: NCWL
      AuroraImperialis:
        gameMapID: AuroraImperialis
        posX: 2000
        posY: 5000
        IFFColor: "#C677A5"
        IFFFaction: DSM
      Tatsumoto:
        gameMapID: Tatsumoto
        posX: -5000
        posY: 1000
        IFFColor: White
        IFFFaction: SHI
      # TFCF members retain their own leadership while sharing Federation infrastructure at the rebuilt Freeport.
      Freeport:
        gameMapID: Freeport
        posX: 6000
        posY: 0
        IFFColor: IndianRed
        IFFFaction: TFSC
      GliessSanto:
        gameMapID: GliessSanto
        posX: -3500
        posY: -2000
        IFFColor: Blue
      RatFakel:
        gameMapID: RatFakel
        posX: 0
        posY: 0
      RatBuran:
        gameMapID: RatBuran
        posX: -2500
        posY: 3500
      RatKovf:
        gameMapID: RatKovf
        posX: 500
        posY: -4300
      RatResearchLabratory:
        gameMapID: RatResearchLabratory
        posX: 2500
        posY: 2500


