# Bindings a passport can be printed in. The cover is cosmetic only - it never touches the
# issuing registry's record - so rebinding one is a forgery the checker machine can still expose.

- type: passportCover
  id: PassportCoverImperial
  nameKey: passport-cover-imperial
  state: passport_sol
  priority: 0

- type: passportCover
  id: PassportCoverUnion
  nameKey: passport-cover-union
  state: passport_qiimaeru
  priority: 1

- type: passportCover
  id: PassportCoverAmerican
  nameKey: passport-cover-american
  state: passport_qiimaeru
  priority: 2

- type: passportCover
  id: PassportCoverClarizian
  nameKey: passport-cover-clarizian
  state: passport_elyran
  priority: 3

- type: passportCover
  id: PassportCoverCoalition
