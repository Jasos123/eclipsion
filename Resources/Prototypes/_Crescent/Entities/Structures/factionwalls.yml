#shuttlewalls

- type: entity
  parent: WallShuttle
  id: ReinforcedShuttleWallCMM
  name: Heavy shuttle wall
  suffix: Reinforced, Exterior
  components:
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 4000
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalSlam
      - trigger:
          !type:DamageTrigger
          damage: 3200
        behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: girder
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - type: NpcFactionMember
      factions:
        - CMMWarship

