# Command mainframe: one console hosting overwatch, diplomacy, alert and economy as tabs.
# Each tab keeps its own component, UI key and server system — this entity just carries all of them.

- type: entity
  abstract: true
  id: BaseMainframeConsole
  parent: BaseComputer
  name: command mainframe
  description: A faction command terminal that bundles the overwatch, diplomacy, alert, market and announcement consoles into one screen, each on its own tab. Locked to the faction it was issued to.
  placement:
    mode: SnapgridCenter
  components:
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower

  # Access is declared here but left empty; every variant must supply its own faction's levels.
  # An AccessReader with no access list allows everyone, so a variant that forgets it ships open.
  - type: AccessReader
  - type: ActivatableUIRequiresAccess
    popupMessage: mainframe-console-access-denied

  # singleUser is load-bearing, not cosmetic: OverwatchConsoleComponent stores its status/squad/search
  # filters on the component rather than per-actor, so two simultaneous viewers would clobber each
  # other's filters. Do not drop this without fixing that first.
  - type: ActivatableUI
    singleUser: true
    key: enum.MainframeUiKey.Key

  - type: MainframeConsole
  - type: OverwatchConsole      # faction set per variant
  - type: DiplomacyConsole
  # Alert scanning runs per console from its own position. Left off so a station that already has a
  # ComputerAlertConsole doesn't start double-broadcasting the moment a mainframe is placed.
  - type: AlertConsole
    enabled: false
  - type: EconomicConsole
    refreshInterval: 300
    autoUpdateEnabled: true

  # Drives the Announcements tab. This is the stock communications-console component, so announcements
  # made from the mainframe go through the exact same server path (access check, cooldown, formatting)
  # as a standalone comms console. Shuttle calling is disabled — the mainframe only broadcasts text.
  - type: CommunicationsConsole
    title: comms-console-announcement-title-station
    canShuttle: false
    global: false
    # No spawn/round-start lockout — a mainframe placed mid-round should be usable at once. The normal
    # between-announcements cooldown (delay) still applies after each broadcast.
    initialDelay: 0

  # PaymentConsole is deliberately absent. MainframeConsoleSystem and the client can host a payroll
  # tab, but this entity's AccessReader is the faction's base tag (so ordinary members can use the
  # overwatch tab), and payroll behind that gate lets any member pay themselves out of the vault.
  # Payroll lives on ComputerPayment*, which is gated on the command tier.

  # Every hosted key must be declared here. A missing one makes both SetUiState and OpenUi silently
  # no-op, which surfaces as a tab that never appears rather than as an error.
  # WiresUiKey included because this block replaces BaseComputer's rather than merging with it —
  # without it the inherited wires panel opens but its UI never does.
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
      enum.MainframeUiKey.Key:
        type: Content.Client._Crescent.Mainframe.MainframeBoundUserInterface
      enum.OverwatchUiKey.Key:
        type: Content.Client._Crescent.Overwatch.OverwatchBoundUserInterface
      enum.DiplomacyConsoleUiKey.Key:
        type: DiplomacyConsoleBoundUserInterface
      enum.AlertConsoleUiKey.Key:
        type: AlertConsoleBoundUserInterface
      enum.EconomicConsoleUiKey.Key:
        type: EconomicConsoleBoundUserInterface
      # Mapped to the mainframe's own announcement BUI (a compact tab) rather than the standalone
      # comms window, so the same UI key drives a tab here but a full window on a normal comms console.
      enum.CommunicationsConsoleUiKey.Key:
        type: Content.Client._Crescent.Mainframe.MainframeAnnouncementBoundUserInterface

  - type: Sprite
    netsync: false
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: tech_key
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    enabled: false
  - type: StationAiWhitelist

# One variant per faction. Access is the faction's base tag — the one every job in that faction
# carries — so any member can use their own faction's mainframe, and only their own.

- type: entity
  parent: BaseMainframeConsole
  id: DSMMainframeConsole
  name: Imperial Command Console
  components:
  - type: OverwatchConsole
    faction: DSM
  - type: AccessReader
    access: [["Empire"]]

- type: entity
  parent: BaseMainframeConsole
  id: NCWLMainframeConsole
  name: Worker's League Command Console
  components:
  - type: OverwatchConsole
    faction: NCWL
  - type: AccessReader
    access: [["NCWLGeneral"]]

- type: entity
  parent: BaseMainframeConsole
  id: SHIMainframeConsole
  name: Shinohara Command Console
  components:
  - type: OverwatchConsole
    faction: SHI
  - type: AccessReader
    access: [["Shinohara"]]

- type: entity
  parent: BaseMainframeConsole
  id: TAPMainframeConsole
  name: Families Command Console
  components:
  - type: OverwatchConsole
    faction: TAP
  - type: AccessReader
    access: [["Families"]]

- type: entity
  parent: BaseMainframeConsole
  id: TFSCMainframeConsole
  name: Coalition Command Console
  components:
  - type: OverwatchConsole
    faction: TFSC
  # SyndicateBasic is the tag every Coalition job carries, matching the other factions' base tags.
  - type: AccessReader
    access: [["SyndicateBasic"]]

# The four company mainframes (Interdyne, Shipfitters, Gorlex, Cyberdawn) that used to sit here were
# removed with the Coalition merger: no job grants the IPM/SAW/GSC/CD faction ids any more, so their
# overwatch rosters were permanently empty, and no map placed them. The Freeport runs the single
# TFSCMainframeConsole above, which every Coalition department shares.

- type: entity
  parent: BaseMainframeConsole
  id: SRMMainframeConsole
  name: Hunt Command Console
  components:
  - type: OverwatchConsole
    faction: SRM
  - type: AccessReader
    access: [["Hunter"]]
