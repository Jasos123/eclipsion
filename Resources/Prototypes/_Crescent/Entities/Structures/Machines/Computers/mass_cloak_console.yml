- type: entity
  parent: [BaseComputerAiAccess, BaseStructureDisableToolUse, BaseStructureUnanchorable]
  id: ComputerMassCloak
  name: mass cloak console
  description: A decommissioned mass cloak console.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: Structures/Shuttles/iff.rsi
      state: helm
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Computer
    board: ComputerTelevisionCircuitboard

- type: entity
  parent: ComputerMassCloak
  id: ComputerMothershipMassCloak
  name: mothership mass cloak console
  description: A decommissioned mothership mass cloak console.
