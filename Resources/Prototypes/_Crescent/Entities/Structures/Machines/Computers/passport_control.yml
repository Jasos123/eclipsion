- type: entity
  parent: BaseComputer
  id: PassportControlComputer
  name: passport control computer
  description: A border-control terminal that verifies a linked passport reader and fingerprint scanner.
  placement:
    mode: SnapgridCenter
  components:
  - type: PassportControlConsole
  - type: DeviceLinkSink
    ports:
    - PassportScanReceiver
    - FingerprintScanReceiver
  - type: ActivatableUI
    key: enum.PassportControlUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PassportControlUiKey.Key:
        type: Content.Client._Crescent.PassportControl.PassportControlBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    netsync: false
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: id_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    enabled: false
    color: "#3fe4ed"
