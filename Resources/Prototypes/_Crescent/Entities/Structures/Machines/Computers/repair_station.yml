- type: entity
  parent: BaseComputer
  id: ComputerShipRepairStation
  name: automated repair slip console
  description: Surveys a docked hull against its structural blueprint, quotes the missing plating and framing at a small markup, then welds it all back on piece by piece.
  placement:
    mode: SnapgridCenter
  components:
  - type: Computer
    board: ShipRepairStationComputerCircuitboard
  - type: ContainerFill
    containers:
      board: [ ShipRepairStationComputerCircuitboard ]
  - type: ShipRepairStation
  - type: Sprite
    netsync: false
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shuttle
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: ActivatableUI
    key: enum.ShipRepairStationUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShipRepairStationUiKey.Key:
        type: Content.Client._Crescent.RepairStation.ShipRepairStationBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#43ccb5"
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4"
    castShadows: false
