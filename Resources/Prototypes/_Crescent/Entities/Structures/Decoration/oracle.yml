# A silent counterpart to the Oracle, using the same statue sprite as the one placed by
# OracleSpawner. It spawns with its fountain already brimming with lotophagoi oil and never
# asks for anything in return.
#
# It deliberately does NOT carry Oracle, Psionic, InnatePsionicPowers, Speech, Actions or
# Prayable, so it makes no demands, never barks, never rejects an item and cannot be prayed
# to. Drinking from (or draining) the fountain is the only thing it is there for.
#
# The fountain also tops itself back up forever, so draining it only ever costs time.

- type: entity
  parent: BaseStructure
  id: OracleDormant
  name: dormant oracle
  description: She asks for nothing. Her fountain was filled long before anyone thought to bargain for it.
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    offset: "0.0,0.5"
    sprite: DeltaV/Structures/Decoration/statues.rsi
    layers:
      - state: oracle-0
      - map: ["enum.SolutionContainerLayers.Fill"]
        state: oracle-0
  - type: SolutionContainerManager
    solutions:
      fountain:
        maxVol: 200
        reagents:
        - ReagentId: LotophagoiOil
          Quantity: 200
  # 1u every 3 seconds - 20u a minute, so a full dose comes back in about a minute and a
  # drained fountain refills in roughly ten. The system clamps to the free volume, so a full
  # fountain never overflows or spills.
  - type: SolutionRegeneration
    solution: fountain
    duration: 3
    generated:
      reagents:
      - ReagentId: LotophagoiOil
        Quantity: 1
  - type: Drink
    solution: fountain
  - type: DrawableSolution
    solution: fountain
  - type: DrainableSolution
    solution: fountain
  - type: ExaminableSolution
    solution: fountain
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 10
    fillBaseName: oracle-
  - type: Grammar
    attributes:
      gender: female
  - type: SpriteFade
  - type: GuideHelp
    guides: [ Psionics ]
