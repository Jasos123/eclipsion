- type: entity
  id: Boombox
  name: boombox
  parent: BaseItem
  description: A morale boosting machine used to play songs on the move. Most likely seen on the hands of a GSC newblood playing some shitty song.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Misc/boombox.rsi
    layers:
    - state: "base"
      map: ["enum.JukeboxVisualLayers.Base"]
  - type: Item
    sprite: _Crescent/Objects/Misc/boombox.rsi
    size: Normal
  - type: Clothing
    sprite: _Crescent/Objects/Misc/boombox.rsi
    quickEquip: false
    slots:
    - Back
    - SuitStorage
  - type: Jukebox
    # Quieter and much tighter than the anchored jukebox: this thing gets carried around the ship,
    # so anyone standing more than a few tiles away should barely register it.
    volume: -13
    range: 6
  - type: Appearance
  - type: ActivatableUI
    key: enum.JukeboxUiKey.Key
  - type: UserInterface
    interfaces:
        enum.JukeboxUiKey.Key:
          type: JukeboxBoundUserInterface
  - type: StaticPrice
    price: 300

