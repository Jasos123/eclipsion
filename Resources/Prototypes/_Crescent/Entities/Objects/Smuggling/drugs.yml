- type: entity
  name: blood-eye injector
  parent: ChemicalMedipen
  id: BloodeyeAutoinjector
  description: A chemical cocktail of combat drugs known to invoke violent tendencies within the user. Blood-eye was originally produced by Shinohara Heavy Industries, but later taken off the shelves after narcotic regulations were put into place. Hauls you back from heavy brute and suffocation while the crash in it breaks stuns and quickens your step, but it thins your blood and you will bleed for as long as it works. Bring gauze, and do not take a second pen unless you want to cook.
