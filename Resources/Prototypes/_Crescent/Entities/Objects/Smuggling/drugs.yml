- type: entity
  name: crash autoinjector
  parent: ChemicalMedipen
  id: CrashAutoinjector
  description: A cheap, easily-produced combat stimulant, most commonly used by combat pilots. Runs you a third faster and shrugs off stuns and knockdowns, at the price of jitters, a stutter and a slow poisoning. It mends nothing. A second pen will cook you from the inside.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Autoinjectors/crash.rsi
    layers:
    - state: medipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Crash
          Quantity: 15
  - type: Tag
    tags: []
  - type: StaticPrice
    price: 1000
  - type: Contraband
    value: 3

- type: entity
  name: exile autoinjector
  parent: ChemicalMedipen
  id: ExileAutoinjector
  description: A common combat stimulant used to both treat wounds sustained during battle and keep an operative on their feet for the duration of the fight. Knits light brute and burns shut while you are still in one piece - it does nothing for a badly mauled body - and runs you a third faster. Never chase it with crash; the two react and poison you. A second pen will burn you alive.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Autoinjectors/exile.rsi
    layers:
    - state: medipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 30
    onlyAffectsMobs: false
    injectOnly: true
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 30
        reagents:
        - ReagentId: Exile
          Quantity: 25
        - ReagentId: TranexamicAcid
          Quantity: 5
  - type: Tag
    tags: []
  - type: Contraband
    value: 5

