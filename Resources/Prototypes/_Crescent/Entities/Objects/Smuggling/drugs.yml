- type: entity
  name: narcan autoinjector
  parent: ChemicalMedipen
  id: NarcanAutoinjector
  description: A chemical used for the stabilization of patients who have overdosed on narcotics. Purges crash, exile, blood-eye, kaiser and ephedrine from the blood and drags a cooking body back down to temperature - the only real answer to a stim overdose. Clears the colours, mends a little poisoning, and leaves the patient dizzy. Works on the dead.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
