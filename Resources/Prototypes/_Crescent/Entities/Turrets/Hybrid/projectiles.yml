- type: entity
  id: BulletPlasmaGatling
  name: unstable focused plasma bolt
  description: Uh oh.
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectilePhasePrevent # still do not remove
    mask:
    - Impassable
    - BulletImpassable
  - type: ProjectileIFF
    visualType: Circle
    color: "#ea86f7" #you have no idea how hard it was to see the previous IFF color
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Structural: 90
        Radiation: 30
  - type: PointLight
    radius: 3.5
    color: purple
    energy: 0.5
  - type: TimedDespawn
    lifetime: 12 # 900 m at 75 m/s
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
      - state: infernoshot
  - type: ShipWeaponProjectile

- type: entity
  id: BulletPlasmaBall
  name: unstable plasmaball
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectilePhasePrevent
    mask:
    - Impassable
    - BulletImpassable
  - type: ProjectileIFF
    visualType: Circle
    color: "#ea86f7"
  - type: ShipWeaponProjectile
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Structural: 420
        Radiation: 80
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Shipgun
    maxIntensity: 250
    intensitySlope: 60
    totalIntensity: 1500
    maxTileBreak: 6
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: TimedDespawn
    lifetime: 25.88 # 2200 m at 85 m/s
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
      - state: magicm_yellow

