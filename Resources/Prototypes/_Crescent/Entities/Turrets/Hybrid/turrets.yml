#starburst

- type: entity
  parent: BaseTurretShipgun
  id: WeaponTurretStarburst
  suffix: Small Hybrid
  name: 200cc 'Starburst' Plasma Gatling
  description: A high-output hybrid weapons platform that superheats unstable units of plasma and flings them at high speeds at targets. The plasma projectiles are inaccurate, but pack a punch.
  components:
    - type: Sprite
      sprite: _Crescent/Objects/Turrets/Hybrid/starburst.rsi
      drawdepth: Mobs
      layers:
        - state: starburst
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1500
          # TODO: Construction graph
          behaviors:
            - !type:ChangeConstructionNodeBehavior
              node: machineFrame
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
          ents: []
    - type: Gun
      burstCooldown: 5.0
      burstFireRate: 10.0
      shotsPerBurst: 50
      fireOnDropChance: 0
      projectileSpeed: 75
      fireRate: 10
      selectedMode: Burst
      availableModes:
      - Burst
      angleDecay: 12
      minAngle: 2
      maxAngle: 18
      angleIncrease: 1.6
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/laserturret.ogg
        params:
          variation: 0.12
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 0.1
      energyPerCharge: 125
      rechargeSound:
        path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
        params:
          pitch: 1.2
          variation: 0.08
    - type: BasicEntityAmmoProvider
      proto: BulletPlasmaGatling
      capacity: 50
      count: 50
    - type: ApcPowerReceiver
      powerLoad: 10000
    - type: WeaponPowerDraw
      energyPerShot: 9000
    - type: Battery
      maxCharge: 450000
      startingCharge: 450000
    - type: ApcPowerReceiverBattery
      idleLoad: 10000
      batteryRechargeRate: 90000
    - type: HardpointAnchorableOnly
      class: Energy
      size: Small

