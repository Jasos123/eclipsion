- type: worldgenConfig
  id: RatWorld
  components:
  - type: WorldController
  - type: BiomeSelection
    biomes:
    - Failsafe
    - RatAsteroidsStandardTaypanOne
    - RatAsteroidsStandardTaypanTwo
    - RatGraveyardWrecks
    #- RatBalreskaWrecks
    #- RatAncientBattlefieldWrecks
    #- RatHeartlandsWrecks
    - RatCraster
    #- RatMarchbelt
    #- RatDeepbelt

# Hyperwar variant: keeps the central belt (RatCraster) but drops the
# surrounding ring (RatAsteroidsStandardTaypan) for a cleaner central battlefield.
- type: worldgenConfig
  id: RatWorldHyperwar
  components:
  - type: WorldController
  - type: BiomeSelection
    biomes:
    - RatStandard
    - RatCraster
    - RatGraveyardMax
    - RatGraveyardMin

# Mapping preset: chunk loading only, no biomes at all, so nothing spawns around whatever the mapper is building.
- type: worldgenConfig
  id: RatWorldEmpty
  components:
  - type: WorldController
