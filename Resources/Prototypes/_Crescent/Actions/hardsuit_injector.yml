- type: entity
  id: ActionHardsuitInjectSlotOne
  name: Inject medipen (slot 1)
  description: Injects you with the medipen loaded into hardsuit slot 1.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: BigItem
    useDelay: 0.5
    event: !type:HardsuitInjectActionEvent
      slot: hardsuit-injector-slot-1

