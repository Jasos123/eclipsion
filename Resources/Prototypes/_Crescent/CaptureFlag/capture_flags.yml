- type: entity
  id: CaptureFlag
  name: capture-flag-name
  description: capture-flag-description
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      anchored: true
    - type: Clickable
    - type: Sprite
      sprite: _Crescent/Structures/medieval_pole_banners.rsi
      state: neutral-white
    - type: CaptureFlag
      radius: 2.0
      captureTime: 45
      neutralizeTime: 45
      decayWhenInactive: true
      decayRate: 1
      dominationEnabled: true
      dominationHoldTime: 900

