- type: entityCategory
  id: Actions
  name: entity-category-name-actions
  hideSpawnMenu: true

# components: anything carrying a GameRule joins this category on its own, so a rule that forgets
# `categories: [ HideSpawnMenu ]` can't leak into the spawn and mapping menus as an errored sprite.
- type: entityCategory
  id: GameRules
  name: entity-category-name-game-rules
  hideSpawnMenu: true
  components:
  - GameRule

# Same deal: objectives live on minds, are never placed in the world, and have no sprite to show.
- type: entityCategory
  id: Objectives
  name: entity-category-name-objectives
  hideSpawnMenu: true
  components:
  - Objective

- type: entityCategory
  id: Roles
  name: entity-category-name-roles
  hideSpawnMenu: true

# markers, atmos fixing, etc
- type: entityCategory
  id: Mapping
  name: entity-category-name-mapping

- type: entityCategory
  id: DoNotMap
  name: entity-category-name-donotmap
  suffix: entity-category-suffix-donotmap
