- type: entity
  parent: CloningPod
  id: MetempsychoticMachine
  name: metempsychotic machine
  description: Originally designed by TAP families to transfer the consciousness of powerful psions into Atryian bodies, this prototype was confiscated by the Saint's Militia and repurposed as a brutal anti-psionic containment device. Its sanction is disputed even within the movement.
  components:
    - type: CloningPod
      doMetempsychosis: true
      biomassCostMultiplier: 0.2
    - type: Machine
      board: MetempsychoticMachineCircuitboard
    - type: Sprite
      sprite: Structures/Machines/metempsychotic.rsi
      snapCardinals: true
      layers:
        - state: cloning_idle
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.CloningPodVisuals.Status:
          base:
            Cloning: { state: cloning_active }
            NoMind: { state: cloning_active }
            Gore: { state: cloning_failed }
            Idle: { state: cloning_idle }
    - type: Psionic
      removable: false
      roller: false
