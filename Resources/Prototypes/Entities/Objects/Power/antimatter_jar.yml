- type: entity
  parent: BaseItem
  id: AmeJar
  name: AME fuel jar
  description: A hermetically sealed jar containing antimatter for use in an antimatter reactor.
  components:
  - type: Item
    size: Normal
    sprite: Objects/Power/AME/ame_jar.rsi
  - type: Sprite
    sprite: Objects/Power/AME/ame_jar.rsi
    state: jar
  - type: AmeFuelContainer
    fuelAmount: 1000
    fuelCapacity: 1000
  # maxVol must match fuelCapacity.
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1000
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: SolutionItemStatus
    solution: tank
  - type: SolutionTransfer
    transferAmount: 250
    minTransferAmount: 50
    maxTransferAmount: 1000
    canChangeTransferAmount: true
  - type: SolutionTransferDirection
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Spillable
    solution: tank
  - type: StaticPrice
    price: 500
  - type: GuideHelp
    guides: [ AME, Power ]
  # Detonate the remaining antimatter when the jar is heated or destroyed.
  - type: Damageable
    damageContainer: Inorganic
  - type: Explosive
    explosionType: Default
    totalIntensity: 300
    intensitySlope: 5
    maxIntensity: 35
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: AmeJar
  id: AmeJarEmpty
  suffix: Empty
  components:
  - type: AmeFuelContainer
    fuelAmount: 0
    fuelCapacity: 1000
  - type: StaticPrice
    price: 80

