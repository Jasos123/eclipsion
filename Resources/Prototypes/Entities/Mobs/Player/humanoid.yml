# Random humanoids

- type: randomHumanoidSettings
  id: EventHumanoid
  # Shitmed Change Start
  speciesBlacklist:
  - Monkey
  - Kobold
  - Abductor
  # Shitmed Change End
  components:
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: GhostTakeoverAvailable

- type: randomHumanoidSettings
  id: EventHumanoidMindShielded
  parent: EventHumanoid
  components:
    - type: MindShield
    - type: AntagImmune

