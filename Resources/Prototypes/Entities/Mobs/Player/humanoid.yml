        - NamesFirstMilitaryLeader
        - NamesLastMilitary
    - type: RandomHumanoidSpawner
      settings: DeathSquad

## SRM ghost roles

- type: entity
  id: RandomHumanoidSpawnerSRMHunter
  name: SRM Hunter
  suffix: SRM, Hunter, Ghost Role
  components:
    - type: Sprite
      sprite: _Crescent/Clothing/SRM/OuterClothing/huntercoat.rsi
      state: icon
    - type: RandomHumanoidSpawner
      settings: SRMHunterSpawner

- type: randomHumanoidSettings
  id: SRMHunterSpawner
  randomizeName: true
  speciesBlacklist:
    - Voidborn
    - Monkey
    - Kobold
    - Reptilian
    - Diona
    - Arachnid
    - Felinid
    - Oni
    - Vox
    - IPC
    - Moth
  components:
    - type: GhostRole
      name: Hunter
      description: A Hunter of the Saint's Militia. You are here to conduct a declared Hunt.
      rules: Help imperials, kill commies.
      raffle:
        settings: short
    - type: LanguageAdder
      addSpoken:
        - LowImperial
      addUnderstood:
        - LowImperial   
    - type: GhostTakeoverAvailable
    - type: Loadout
      prototypes: [ HunterGhostGear ]
    - type: HullrotFaction
      faction: SRM
    - type: Telepathic
    - type: BibleUser
    - type: RandomMetadata
      nameSegments:
        - names_first_male
        - names_last

- type: startingGear
  id: HunterGhostGear
  equipment:
    id: HunterPDA
    ears: ClothingHeadsetHunter
    eyes: ClothingEyesGlassesSunglasses
    jumpsuit: ClothingUniformJumpsuitHunter
    neck: ClothingNeckMantleSr
    shoes: ClothingShoesBootsImperialJackboots
    outerClothing: ClothingOuterArmorClarizianTrooperArmor
    gloves: ClothingHandsGlovesHunter
    suitstorage: WeaponRifleHunter
    head: ClothingHeadHatHunter
    pocket1: RomaineBible
    pocket2: KaiserAutoinjector
    back: ClothingBackpackSRM
    belt: ClothingBeltSheathKhopeshFilled
  storage:
    back:
      - MedkitCombatFilled
      - MagazineRifle
      - MagazineRifle
      - MagazineRifle
      - MagazineRifle
      - Portafib

- type: entity
