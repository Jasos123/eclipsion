- type: entity
  save: false
  name: Urist McSkelly
  parent:
  - MobFlammable
  - BaseMobSpecies
  id: BaseMobSkeletonPerson
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Skeleton
  - type: Carriable # Carrying system from nyanotrasen.
  - type: Icon
    sprite: Mobs/Species/Skeleton/parts.rsi
    state: full
  - type: Body
    prototype: Skeleton
    requiredLegs: 2
    gibSound: /Audio/Effects/bone_rattle.ogg
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Skeleton
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#555555AA"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      150: Dead
  - type: TransferMindOnGib
  # Gibbing used to sit exactly on the 150 death threshold, so a skeleton
  # crumbled the instant it died and left nothing to revive. The gap between
  # 150 and 250 is the window a medic has to heal the remains back under the
  # death threshold (milk, brute packs, ointment) and then defib them. Overkill
  # past 250 still shatters the body for good.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:GibBehavior
        gibContents: Skip
  - type: SlowOnDamage #modified speeds because they're so weak
    speedModifierThresholds:
      60: 0.9
      80: 0.7
  # Skeletons deliberately get no ThermalRegulator, so bare bones simply settle
  # at whatever the room is instead of holding 310 K. Combined with the low
  # specific heat below, a skeleton chills to ambient far faster than a human
  # ever could, which is what makes the slowdown bite almost immediately.
  # No coldDamage/heatDamage is defined, so temperature only ever slows a
  # skeleton down - it never hurts one. Note that TemperatureSystem applies
  # those with ignoreResistances, so listing cold damage here would punch
  # straight through the species' Cold 0.0 immunity.
  - type: Temperature
    currentTemperature: 293.15
    specificHeat: 20 # less than half a human's 42, so it swings twice as fast
    atmosTemperatureTransferEfficiency: 0.3 # default is 0.1
    coldDamageThreshold: 0 # never reached, cold is a movement penalty only
    heatDamageThreshold: 10000
  # Top threshold sits below the 293.15 K of a pressurised room, so a skeleton
  # walking a normal station is never penalised. Anything genuinely cold - a
  # breached compartment, cold storage, a hull section open to space - hits hard.
  - type: TemperatureSpeed
    thresholds:
      285: 0.8
      275: 0.6
      265: 0.4
      250: 0.25
  - type: Speech
    speechVerb: Skeleton
  - type: ZombieImmune
  - type: Vocal
    sounds:
      Male: Skeleton
      Female: Skeleton
      Unsexed: Skeleton
  - type: SkeletonAccent
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 130
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPieReaction
    - reagents: [ Milk, MilkGoat, MilkSoy, MilkSpoiled ]
      # add new types of milk to reagents as they appear, oat milk isn't on the list
      # because turns out oat milk has 1/30th the amount of calcium in it compared to the rest
      # even if it's a meme - I did research
      methods: [ Touch ]
      effects: # TODO: when magic is around - make a milk transformation to a skeleton monster
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          groups:
            # Halved. Milk is now the main way to bring a dead skeleton back under
            # its death threshold, so a full carton should be worth roughly one
            # brute pack rather than two of them plus a burn kit.
            Burn: -1
            Brute: -0.75 # these groups are the only 2 possible ways to damage a skeleton
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "skeleton-healed-by-milk-popup" ]
        probability: 0.25
    - reagents: [ MilkOat ]
      methods: [ Touch ]
      effects:
        - !type:PopupMessage
          type: Local
          visualType: Large
          messages: [ "skeleton-sprayed-by-oat-milk-popup" ]
          probability: 0.5
  - type: FireVisuals
    alternateState: Standing
  - type: TypingIndicator
    proto: skeleton
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - Calcic
    understands:
    - TauCetiBasic
    - Calcic
  - type: FootPrints
  - type: LayingDown

- type: entity
  parent: BaseSpeciesDummy
  id: MobSkeletonPersonDummy
  categories: [ HideSpawnMenu ]
  components:
    - type: HumanoidAppearance
      species: Skeleton
