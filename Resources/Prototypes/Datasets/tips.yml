- type: dataset
  id: Tips
  values:
  - "Sector Crescent is a prize that keeps becoming valuable again. Its wars continue because the frontier is useful, connected, and too profitable to abandon."
  - "The Crescent Recurrence is the formal name for the regional temporal instability that most spacers simply call the Turning."
  - "A Turning does not reset political history, resurrect the dead, or erase every object in a system. It pulls exposed matter toward one of several previously stable physical states."
  - "Ore moved out of an active recurrence basin remains real. The stripped field may later regain enough mass to be mined again."
  - "Manufactured cargo left inside a recurrence basin is more likely to be erased, damaged, or restored to a useless earlier state than duplicated cleanly."
  - "Major ports and mature cities survive the Turning through stable mass, deep foundations, constant maintenance, and expensive chronal anchors."
  - "Knowledge does not reset. Taypani frontier research represents current-cycle testing, adaptation, calibration, and fabrication profiles."
  - "Anchor Vaults protect records, identity templates, reference samples, and selected calibration baselines, but they are too expensive and limited to stabilize the whole frontier."
  - "A severe Turning can be forecast like dangerous weather: professionals know a bad window is coming without knowing exactly which compartment or asteroid will revert."
  - "Power in Crescent follows dependable bases and traffic corridors rather than clean territorial borders."
  - "Asterwald and its capital Edelheim are the stable administrative rear of Count Olywier Rabenau's Imperial charter."
  - "Domain lies beyond Crescent and supplies Imperial legitimacy, high charters, Synod recognition, major appeals, and the election of the Kaiser."
  - "The Kaiser is elected by Crown Electors in Conclave. A powerful dynasty may dominate several reigns, but succession is not automatically hereditary."
  - "The Lord Admiral commands Count Olywier's active frontier military. Local nobles select a candidate, and Olywier confirms the choice."
  - "The Imperial Adjutant is a Crown Overseer, observer, and diplomatic liaison. The office reports to Domain and has no routine authority over local fleets."
  - "Freeholders include workers, miners, technicians, small property holders, tenant crews, and ordinary families. They are not automatically serfs or slaves."
  - "Oathbound status protects non-human and foreign-faith subjects who accept Imperial law, but it remains an unequal status and varies sharply by charter."
  - "The four universal Imperial Saints are Serraine, Romaine, Remiel, and Guies. They are exemplary humans in official theology, not gods."
  - "The Saint's Militia is one extremist movement with four currents: the Mercy Furnace, Final Crusade, Living Codex, and Divine Balance."
  - "The Mandate licenses useful psions through the House of Questions. The Saint's Militia hunts psions even when Imperial authorities have sanctioned them."
  - "Chengridz is secure Workers' Union territory, formerly called Vaucelles. The NCWL is the provisional revolutionary front operating through contested Crescent."
  - "Kane organized the Vaucelles uprising before Workers' Union support arrived. The Union professionalized a revolution that already possessed local legitimacy."
  - "MVD officers attached to the NCWL remain Workers' Union personnel. They do not belong to whichever League party wins local leadership."
  - "The Homeguard is a Crescent force descended from local cadres trained in professional warfare by Workers' Union officers and veterans."
  - "Shinohara's preferred victory is dependency: finance the ship, insure the crew, license the systems, store the clone template, and sell the replacement parts."
  - "Prometheus Shipyards is a standards center. Every successful SHI-compatible design creates future demand for parts, training, and service."
  - "The Taypani Free Companies Federation is GSC, Interdyne, Cyberdawn, and SAW under a jointly chosen Ringleader for Federation-wide matters."
  - "The TFCF is anti-Shinohara without being anti-capitalist. Its members oppose monopoly because they intend to remain independent participants in Taypan's market."
  - "Gorlex protects routes, Interdyne keeps crews alive, Cyberdawn supplies technology and intelligence, and SAW provides material, repair, and industrial capacity."
  - "The Shipbreaker Astronautics Workers Union is a worker-owned collective inside the TFCF, not a subordinate branch of the Workers' Union."
  - "The Taypani-Atyrian Pact is built from Izdari, Arabet, Al'Seik, and Thukker family networks. Kinship may come from blood, oath, adoption, marriage, or long service."
  - "The aging carrier-workshop Aasim is a famous Pact market and meeting place, but the Pact has no fixed territorial capital."
  - "Gliess Santo docks anyone who obeys station law and belongs to no outside faction. The King's Articles make neutrality more useful than conquest."
  - "The Gliessian Sheriff and Deputies inherit their emphasis on local jurisdiction and civilian protection from survivors of the Colonial Minutemen."
  - "Analliesse was the CMM's mobile headquarters, arsenal, court, barracks, workshop, and fleet base before Imperial forces destroyed it."
  - "Psionics predate Crescent and occur outside the sector. Potentia measures raw potential; amplification and dampening describe strength and control."
  - "A clone remembers what its stored neural template remembered and nothing after that recording. Better template freshness is one of Crescent's sharpest class divisions."
  - "Repeated neural imprinting can cause sleeve drift; severe cases remain known as Sleever Psychosis."
  - "Trade goods can be bought at station dispensaries and commissaries or manufactured in commodity fabricators, then sold at other stations."
  - "A station's turn-in chute pays according to local demand and how much of the same good has already been sold there."
  - "A Mass Scanner and GPS are always useful in Taypan. Veteran spacers compare several recurrence forecasts before risking expensive equipment."
  - "The chances of being murdered by your coworkers are low, but never zero."
