# Baseline
- type: entity
  id: BaseAsteroidDebrisNF
  parent: BaseDebrisNF
  name: Asteroid Debris
  abstract: true
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorTileset:
      - FloorAsteroidSand
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: SimpleFloorPlanPopulator
      # Ratgore Start - the generalist belt rock. Bulk ore was already reasonable, but the
      # precious tail was rounding error (gold/silver 0.18%, plasma 0.07%), so a sand
      # asteroid was only ever coal, tin, quartz and copper. Ore 24% -> 31%, and the
      # rare materials are now rare rather than absent. Salt is a trace find here; the
      # solid rock asteroids stay the real salt source.
      entries:
        FloorAsteroidSand:
          - id: WallRock
            prob: 0.5
            orGroup: rock
          - id: WallRockCoal
            prob: 0.048
            orGroup: rock
          - id: WallRockTin
            prob: 0.048
            orGroup: rock
          - id: WallRockQuartz
            prob: 0.048
            orGroup: rock
          - id: WallRockCopper
            prob: 0.048
            orGroup: rock
          - id: WallRockGold
            prob: 0.01
            orGroup: rock
          - id: WallRockSilver
            prob: 0.01
            orGroup: rock
          - id: WallRockTungsten
            prob: 0.008
            orGroup: rock
          - id: WallRockUranium
            prob: 0.005
            orGroup: rock
          - id: WallRockSalt
            prob: 0.006
            orGroup: rock
          - id: WallRockPlasma
            prob: 0.004
            orGroup: rock
          - id: WallRockArtifactFragment
            prob: 0.002
            orGroup: rock
          - id: RandomArtifactSpawner20
            prob: 0.0015
            orGroup: rock
          - id: RockElementalSpawner
            prob: 0.009
            orGroup: rock
          - id: FuelSeepBoriatic
            prob: 0.006
            orGroup: rock
      # Ratgore End
    - type: IFF
      flags: HideLabel
      color: "#d67e27"
    # Ratgore Start - clean up rocks the miners have hollowed out and left behind.
    - type: MinedAsteroidDecay
      claimWhitelist:
        components:
        - PowerSupplier
        - FuelGenerator
        - FuelExtractor
    # Ratgore End

