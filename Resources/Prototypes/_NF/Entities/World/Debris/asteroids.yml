# Snow

- type: entity
  id: BaseAsteroidDebrisNFIce
  parent: BaseDebrisNF
  name: Salvage Iced Asteroid
  abstract: true
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorTileset:
      - FloorIce
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: SimpleFloorPlanPopulator
      # Ratgore Start - ice was the worst rock in the game at 10% ore against 88% bare
      # snow, and it is a third of the Taypan belts, so most of the standard belt was
      # not worth the trip. Ore 10% -> 25%, still the leanest of the four families, but
      # ice is now the best place to find plasma and uranium and the worst for bulk
      # metal. No fuel seep on purpose - boriatic is sand, AME is chromite.
      entries:
        FloorIce:
          - id: WallRockSnow
            prob: 0.5
            orGroup: rock
          - id: WallRockSnowPlasma
            prob: 0.027
            orGroup: rock
          - id: WallRockSnowCoal
            prob: 0.026
            orGroup: rock
          - id: WallRockSnowTin
            prob: 0.026
            orGroup: rock
          - id: WallRockSnowUranium
            prob: 0.022
            orGroup: rock
          - id: WallRockSnowQuartz
            prob: 0.019
            orGroup: rock
          - id: WallRockSnowCopper
            prob: 0.019
            orGroup: rock
          - id: WallRockSnowGold
            prob: 0.012
            orGroup: rock
          - id: WallRockSnowSilver
            prob: 0.012
            orGroup: rock
          - id: WallRockSnowTungsten
            prob: 0.01
            orGroup: rock
          - id: WallRockSnowArtifactFragment
            prob: 0.002
            orGroup: rock
          - id: RandomArtifactSpawner20
            prob: 0.0015
            orGroup: rock
          - id: SnowElementalSpawner
            prob: 0.009
            orGroup: rock
      # Ratgore End
    - type: IFF
      flags: HideLabel
      color: "#d6fffc"
    # Ratgore Start - clean up rocks the miners have hollowed out and left behind.
    - type: MinedAsteroidDecay
      claimWhitelist:
        components:
        - PowerSupplier
        - FuelGenerator
        - FuelExtractor
    # Ratgore End

