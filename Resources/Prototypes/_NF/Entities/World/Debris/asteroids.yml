# Chromite

- type: entity
  id: BaseAsteroidDebrisNFChromite
  parent: BaseDebrisNF
  name: Salvage Chromite Asteroid
  abstract: true
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorTileset:
      - FloorChromite
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: SimpleFloorPlanPopulator
      guaranteedSpawns:
        FloorChromite:
        - FuelSeepAme
      # Ratgore Start - the crater belt runs on these; upstream shipped them at ~6% ore
      # per tile with an 11% golem/crab roll on top, so a "rich" purple rock mined out
      # barren. Ore is now ~34% of a tile roll and the elemental spawner is a hazard
      # rather than the most common thing in the asteroid.
      entries:
        FloorChromite:
          - id: RandomArtifactSpawner20
            prob: 0.006
            orGroup: rock
          - id: ChromiteElementalSpawner
            prob: 0.028
            orGroup: rock
          - id: WallRockChromite
            prob: 0.65
            orGroup: rock
          - id: WallRockChromiteTin
            prob: 0.09
            orGroup: rock
          - id: WallRockChromiteCoal
            prob: 0.075
            orGroup: rock
          - id: WallRockChromiteQuartz
            prob: 0.065
            orGroup: rock
          - id: WallRockChromiteCopper
            prob: 0.055
            orGroup: rock
          - id: WallRockChromiteTungsten
            prob: 0.03
            orGroup: rock
          - id: WallRockChromitePlasma
            prob: 0.018
            orGroup: rock
          - id: WallRockChromiteUranium
            prob: 0.014
            orGroup: rock
          - id: WallRockChromiteGold
            prob: 0.006
            orGroup: rock
          - id: WallRockChromiteSilver
            prob: 0.006
            orGroup: rock
          - id: WallRockChromiteArtifactFragment
            prob: 0.005
            orGroup: rock
          - id: FuelSeepAme
            prob: 0.006
            orGroup: rock
      # Ratgore End
    - type: IFF
      flags: HideLabel
      color: "#8178cc"
    # Ratgore Start - clean up rocks the miners have hollowed out and left behind.
    - type: MinedAsteroidDecay
      claimWhitelist:
        components:
        - PowerSupplier
        - FuelGenerator
        - FuelExtractor
