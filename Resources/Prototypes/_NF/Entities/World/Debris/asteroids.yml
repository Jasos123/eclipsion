# Asteroid Asteroid Debris, because yes, base asteroid is made NOT from asteroid

- type: entity
  id: BaseRockAsteroidDebrisNF
  parent: BaseAsteroidDebrisNF
  name: Asteroid Rock Debris
  abstract: true
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorTileset:
        - FloorAsteroidSand
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: SimpleFloorPlanPopulator
      # Ratgore Start - solid rock was already the densest ore at 39%, so it only needed
      # its dead precious tail fixed (gold/silver were 0.09%). Ore 39% -> 44%, best gold,
      # silver and salt of the four, and the elemental rate is trimmed 8% -> 6% so it is
      # still the most dangerous rock to mine without being a mob farm.
      entries:
        FloorAsteroidSand:
          - id: AsteroidRock
            prob: 0.57
            orGroup: rock
          - id: AsteroidRockCopper
            prob: 0.1
            orGroup: rock
          - id: AsteroidRockCoal
            prob: 0.095
            orGroup: rock
          - id: AsteroidRockTin
            prob: 0.095
            orGroup: rock
          - id: AsteroidRockQuartz
            prob: 0.095
            orGroup: rock
          - id: AsteroidRockElementalSpawner
            prob: 0.06
            orGroup: rock
          - id: AsteroidRockSalt
            prob: 0.028
            orGroup: rock
          - id: AsteroidRockGold
            prob: 0.025
            orGroup: rock
          - id: AsteroidRockSilver
            prob: 0.025
            orGroup: rock
          - id: AsteroidRockTungsten
            prob: 0.016
            orGroup: rock
          - id: AsteroidRockPlasma
            prob: 0.011
            orGroup: rock
          - id: AsteroidRockUranium
            prob: 0.011
            orGroup: rock
          - id: RandomArtifactSpawner20
            prob: 0.01
            orGroup: rock
          - id: AsteroidRockArtifactFragment
            prob: 0.004
            orGroup: rock
      # Ratgore End
    - type: IFF
      flags: HideLabel
      color: "#BF8C5C"

