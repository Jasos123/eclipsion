- type: htnCompound
  id: MeleePsionicFamiliarCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: FollowCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# A commandable familiar. Orders sit above everything the familiar would do on its own, because a
# familiar that keeps fighting through a move order is one nobody can use: HTN only ever swaps a
# running plan for one from a lower-numbered branch, so autonomous combat at the top meant the
# escort and order branches below it could never take over while there was anything to shoot at.
- type: htnCompound
  id: RangedPsionicFamiliarCompound
  branches:
    # The master named a target. Nothing else happens until it is dead or the order is replaced.
    - preconditions:
        - !type:KeyExistsPrecondition
          key: CurrentOrderedTarget
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: OrderedGunCombatCompound

    # The master pointed at a spot. Go there and hold it.
    - preconditions:
        - !type:KeyExistsPrecondition
          key: OrderedMoveTarget
      tasks:
        - !type:HTNCompoundTask
          task: OrderedMoveCompound

    # No standing order: stay with the master and shoot what threatens them on the way.
    - tasks:
        - !type:HTNCompoundTask
          task: PsionicFamiliarEscortCompound

    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# Free behaviour, one step down the tree so its own branches can still preempt each other: a hostile
# turning up while the familiar is trailing its master promotes it from following to shooting.
- type: htnCompound
  id: PsionicFamiliarEscortCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    - preconditions:
        - !type:KeyExistsPrecondition
          key: FollowTarget
      tasks:
        - !type:HTNCompoundTask
          task: FollowCompound

    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# GunCombatCompound with the target handed to it instead of chosen by it.
- type: htnCompound
  id: OrderedGunCombatCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: CommandedTarget

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: CommandedTarget
              key: Target

# Walk to the spot the master pointed at, then stand there. The key is never cleared on arrival, so
# the familiar holds the position across replans rather than drifting back to its master.
- type: htnCompound
  id: OrderedMoveCompound
  branches:
    - preconditions:
        - !type:CoordinatesNotInRangePrecondition
          targetKey: OrderedMoveTarget
          rangeKey: FollowCloseRange
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: OrderedMoveTarget
            pathfindKey: OrderedMovePathfind
            rangeKey: FollowCloseRange

    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime

        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
